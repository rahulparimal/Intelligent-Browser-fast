[package]
name = "ibos-cli"
description = "intelli-rust: local search, admin UI and (soon) browser agent in one small binary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "intelli-rust"
path = "src/main.rs"

[features]
default = []
# Exact OpenAI token counts in `distill`.
exact-tokens = ["ibos-ctx/openai-tokenizer"]

[dependencies]
ibos-agent.workspace = true
ibos-cdp.workspace = true
ibos-ctx.workspace = true
ibos-dom.workspace = true
ibos-llm.workspace = true
ibos-mem.workspace = true
ibos-search.workspace = true
ibos-retrieval.workspace = true
ibos-server.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[dev-dependencies]
axum = "0.8"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
